# Production overrides — TR VPS (KVKK: veri TR içinde kalır)
services:
  api:
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  mosquitto:
    restart: unless-stopped

  prometheus:
    restart: unless-stopped

  grafana:
    restart: unless-stopped

  edge-gateway:
    profiles:
      - edge
    restart: unless-stopped
